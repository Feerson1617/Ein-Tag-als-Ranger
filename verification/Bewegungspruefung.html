<!doctype html><html lang="de"><meta charset="utf-8"><base href="../dist/"><title>Bewegungsprüfung · Feldbuch</title><style>body{margin:0;background:#dce5dd;color:#1b3026;font:16px system-ui}canvas{display:block;width:100vw;height:100vh}nav{position:absolute;top:20px;left:20px;background:#fff9;padding:14px;border-radius:12px}select,button{font:inherit;padding:8px}span{display:block;margin-top:8px}</style><nav><select aria-label="Prüftier" id="animal"><option value="fox">Rotfuchs</option><option value="hare">Feldhase</option><option value="capreolus_capreolus">Reh</option><option value="parus_major">Kohlmeise</option><option value="carcinus_maenas">Strandkrabbe</option><option value="rana_temporaria">Grasfrosch</option><option value="coccinella_septempunctata">Marienkäfer</option></select> <label><input type="checkbox" id="flight" aria-label="Flugbeobachtung"> Flug</label> <button id="pause">Anhalten</button><span id="caption">Langsames Gehen · Bodenkontakt und Gelenkbeugung</span></nav><canvas id="canvas"></canvas><script type="module">
import * as T from './vendor/three.module.js?revision=102';
import {WildlifeRenderer} from './wildlife.js?revision=102';
import {ANIMALS} from './biodiversity.js?revision=102';
const scene=new T.Scene();scene.background=new T.Color('#cedbcf');scene.add(new T.HemisphereLight('#ffffff','#566343',2));const sun=new T.DirectionalLight('#fff3df',3);sun.position.set(4,8,3);scene.add(sun);
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.001,200);
const floor=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:'#8c987d',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.002;scene.add(floor);const grid=new T.GridHelper(30,300,'#7c876c','#adb59c');scene.add(grid);
let actor,world,paused=false,last=performance.now();function choose(){if(world)world.dispose();const id=document.querySelector('select').value;actor={id:1,species:id,habitat:'forest',alive:true,x:0,z:0,heading:0,trait:1,age:0,phase:0,activity:'walking'};world=new WildlifeRenderer(scene,[actor]);}
document.querySelector('select').onchange=choose;document.querySelector('button').onclick=()=>{paused=!paused;document.querySelector('button').textContent=paused?'Weiterlaufen':'Anhalten';};choose();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.04,(now-last)/1000);last=now;const s=ANIMALS[actor.species],speed=Math.min(.32,s.size*.9);actor.activity=s.type==='bird'&&document.querySelector('#flight').checked?'flying':'walking';actor.flight=actor.activity==='flying'?1.5:0;document.querySelector('#caption').textContent=actor.activity==='flying'?'Flugpose · angezogene Laufbeine':'Langsames Gehen · Bodenkontakt und Gelenkbeugung';if(!paused){actor.age+=dt;actor.x+=dt*speed;actor.z=.3*Math.sin(actor.x*.5);actor.heading=Math.atan2(.15*Math.cos(actor.x*.5),1);}world.update(()=>0,()=>-1,null);const L=s.size;camera.position.set(actor.x+L*.25,actor.y+L*.65,actor.z+L*2.6);camera.lookAt(actor.x,actor.y+L*.3,actor.z);grid.position.x=Math.floor(actor.x);grid.scale.setScalar(Math.max(.07,L));renderer.render(scene,camera);}requestAnimationFrame(frame);
</script></html>
