<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Feldbuch · Tablet- und Einbettungsprüfung</title><style>body{margin:0;padding:12px;background:#e8eddf;color:#233d31;font:15px system-ui}select{min-height:44px;padding:8px;font:inherit}iframe{display:block;border:1px solid #718774;margin-top:12px;background:#1c3228}p{max-width:720px}</style></head><body><h1>Lokale Einbettungsprüfung</h1><p>Das vorbereitete Pages-Spiel läuft hier in einem eingebetteten Fenster mit festem Tabletformat und einem anderen lokalen Ursprung. Dies prüft das Layout, kein echtes Tablet.</p><label>Prüfformat <select id="format"><option value="768,1024">Tablet hochkant · 768 × 1024</option><option value="1024,768">Tablet quer · 1024 × 768</option><option value="760,480">Kompakte Einbettung · 760 × 480</option></select></label><iframe id="game" width="768" height="1024" src="http://localhost:4174/GitHub-Pages/index.html" title="Feldbuch im Tabletformat" allow="fullscreen" allowfullscreen></iframe><script>document.getElementById('format').onchange=e=>{const [w,h]=e.target.value.split(',');const frame=document.getElementById('game');frame.width=w;frame.height=h;};</script></body></html>
