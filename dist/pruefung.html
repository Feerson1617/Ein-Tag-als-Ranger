<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feldbuch · Modell- und Sitzungskontrolle</title><style>
body{margin:0;background:#c4cbbb;color:#22372e;font:14px system-ui}nav{position:fixed;inset:12px auto auto 12px;z-index:3;background:#f5f3e9ed;border-radius:8px;padding:12px;max-width:510px}select,button{font:inherit;min-height:44px;padding:8px;margin:3px}label{display:inline-flex;align-items:center;gap:8px}input[type=range]{width:120px}#caption{display:block;font-size:12px;line-height:1.6;max-width:490px}canvas,iframe{display:block;width:100vw;height:calc(100vh - 200px);margin-top:200px;border:0}iframe{height:calc(100vh - 140px);margin-top:140px}[hidden]{display:none!important}#status{font:12px monospace;white-space:pre-wrap}
</style></head><body><nav><select id="surface" aria-label="Prüfbereich"><option value="animals">Tiermodelle</option><option value="session">Spiel und Grafik-Wiederherstellung</option></select><span id="model-controls"><select id="animal" aria-label="Prüftier"></select><select id="activity" aria-label="Bewegungsart"><option value="resting">Ruhen</option><option value="walking">Gehen</option><option value="flying">Fliegen</option><option value="wingDrying">Flügel trocknen</option></select><button id="pause">Anhalten</button><label>Blickwinkel<input id="angle" type="range" min="-180" max="180" value="75"></label></span><span id="session-controls" hidden><button id="lose">Grafikverlust auslösen</button><button id="restore">Grafik wiederherstellen</button></span><span id="caption">Lokale Kontrolle am tatsächlichen Spielmodell. Gehen: Bodenkontakt; Ruhen: Kopf und Atmung; Flug: eingezogene Beine.</span><output id="status"></output></nav><canvas id="canvas"></canvas><script type="module">
import * as T from './vendor/three.module.js?revision=120';
import {WildlifeRenderer} from './wildlife.js?revision=120';
import {prepareAuthoredWildlife} from './authored-wildlife.js?revision=121';
import {ANIMALS} from './biodiversity.js?revision=120';
const $=id=>document.getElementById(id),scene=new T.Scene();scene.background=new T.Color('#c4cbbb');scene.add(new T.HemisphereLight('#eff2eb','#626c4d',2));const sun=new T.DirectionalLight('#fff0dc',2.5);sun.position.set(4,8,3);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.normalBias=.002;scene.add(sun);
const renderer=new T.WebGLRenderer({canvas:$('canvas'),antialias:true});renderer.setPixelRatio(1.5);renderer.shadowMap.enabled=true;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;const camera=new T.PerspectiveCamera(35,1,.001,200);
const floor=new T.Mesh(new T.PlaneGeometry(300,300),new T.MeshStandardMaterial({color:'#7f896a',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.002;floor.receiveShadow=true;scene.add(floor);
for(const id of ['haematopus_ostralegus','phalacrocorax_carbo','falco_tinnunculus','parus_major','ardea_cinerea','cygnus_olor','fox','hare','capreolus_capreolus','phoca_vitulina','halichoerus_grypus','sciurus_vulgaris','carcinus_maenas']){const option=document.createElement('option');option.value=id;option.textContent=ANIMALS[id].common;$('animal').append(option);}
await prepareAuthoredWildlife();
let actor,world,paused=false,last=performance.now(),mode='animals';
function choose(){world?.dispose();actor={id:1,species:$('animal').value,habitat:'forest',alive:true,x:0,z:0,heading:0,trait:1,age:0,phase:1.3,activity:'resting'};world=new WildlifeRenderer(scene,[actor]);}
function resize(){const height=Math.max(160,innerHeight-200);renderer.setSize(innerWidth,height,false);camera.aspect=innerWidth/height;camera.updateProjectionMatrix();}window.addEventListener('resize',resize);resize();choose();
$('animal').onchange=choose;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Weiterbewegen':'Anhalten';};
$('surface').onchange=()=>{if($('surface').value==='session')location.href='./index.html?pruefung=1';};
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.04,(now-last)/1000);last=now;if(document.hidden)return;const s=ANIMALS[actor.species],speed=Math.min(.32,s.size*.9);actor.activity=$('activity').value;actor.flight=actor.activity==='flying'&&s.type==='bird'?1.5:0;if(!paused){actor.age+=dt;if(actor.activity==='walking'){actor.x+=dt*speed;actor.z=.3*Math.sin(actor.x*.5);actor.heading=Math.atan2(.15*Math.cos(actor.x*.5),1);}}world.update(()=>0,()=>-1,null);const L=s.size,angle=Number($('angle').value)*Math.PI/180,box=world.batches.get(actor.species).mesh.geometry.boundingBox,center=box.getCenter(new T.Vector3()),height=box.max.y-box.min.y,distance=Math.max(height*.5,L*.5/camera.aspect)/Math.tan(camera.fov*Math.PI/360)*1.35;camera.position.set(actor.x+center.x+Math.cos(angle)*distance,actor.y+center.y+height*.25,actor.z+Math.sin(angle)*distance);camera.lookAt(actor.x+center.x,actor.y+center.y,actor.z);renderer.render(scene,camera);$('status').textContent=`${s.common} · ${renderer.info.render.triangles} Dreiecke · ${actor.activity} · ${paused?'angehalten':'laufend'}`;}requestAnimationFrame(frame);
</script></body></html>
