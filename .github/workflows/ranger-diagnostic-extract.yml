name: Ranger diagnostic extraction
on:
  push:
    branches: [feature/ranger-kompakt]
    paths: [.github/workflows/ranger-diagnostic-extract.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-failure-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 40384719887
          artifact-ids: 12684991385
          path: original-proof
      - name: Read original failure context without altering the test result
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          source=Path('original-proof'); out=Path('compact-diagnostic'); out.mkdir()
          inventory=[]
          for p in source.rglob('*'):
              if p.is_file() and (p.name in ['error-context.md','test-failed-1.png','browser.json']):
                  relative=p.relative_to(source); target=out/relative
                  target.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,target)
                  inventory.append({'originalPath':str(relative),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
                  if p.name=='error-context.md': print(p.read_text())
          assert any(x['originalPath'].endswith('error-context.md') for x in inventory)
          (out/'ORIGINALS.json').write_text(json.dumps({'sourceRun':40384719887,'sourceAttempt':3,'sourceArtifact':12684991385,'scope':'Unmodified selected files from the failed original run. Not a new passing test.','files':inventory},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Ranger-SCORM-original-failure-context
          path: compact-diagnostic/
          if-no-files-found: error
          retention-days: 30
