name: Ranger RC acceptance
on:
  push:
    branches: [feature/ranger-kompakt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        check: [native, stability, visual, profiles, offline]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build and audit this exact source
        run: |
          for f in dist/compact/*.js; do node --check "$f"; done
          python tools/build-compact.py
          python tools/verify-compact.py
          mkdir -p work/rc-final
      - name: Native K1–K5 and four saved feeding episodes
        if: matrix.check == 'native'
        run: python tools/browser-compact-native-learning.py --site outputs --entry Ranger-Kompakt.html --output work/rc-final/native
      - name: Full original twenty-minute stability and native context recovery
        if: matrix.check == 'stability'
        run: python tools/browser-compact-stability.py --output work/rc-final/stability
      - name: Direct file and offline browser use of the actual standalone HTML
        if: matrix.check == 'offline'
        run: |
          set +e
          python tools/browser-compact-offline.py --direct-file
          direct_status=$?
          cp -a work/visual/offline-final work/rc-final/offline-direct
          python tools/browser-compact-offline.py
          http_status=$?
          cp -a work/visual/offline-final work/rc-final/offline-http
          test "$direct_status" = 0 && test "$http_status" = 0
      - name: Build the independently reviewed baseline without editing it
        if: matrix.check == 'visual' || matrix.check == 'profiles'
        run: |
          git worktree add --detach work/rc-baseline e7b34dbadef037fee2554d41034f11116f0de81e
          (cd work/rc-baseline && python tools/build-compact.py)
      - name: Exact camera and model-time comparisons, complete specimen inventory and 360-degree sky
        if: matrix.check == 'visual'
        run: |
          python tools/browser-compact-revision-visual.py --entry work/rc-baseline/outputs/Ranger-Kompakt.html --output work/rc-final/visual-before
          python tools/browser-compact-revision-visual.py --entry outputs/Ranger-Kompakt.html --output work/rc-final/visual-after --compare work/rc-final/visual-before/result.json
          python tools/browser-compact-visual-gallery.py --entry outputs/Ranger-Kompakt.html --output work/rc-final/gallery
          python tools/browser-compact-sky.py --output work/rc-final/sky
      - name: Isolated sequential baseline and candidate CPU/GPU samples at both viewports
        if: matrix.check == 'profiles'
        run: |
          for width in 600 1200; do
            if [ "$width" = 600 ]; then height=375; else height=800; fi
            python tools/profile-compact.py --entry work/rc-baseline/outputs/Ranger-Kompakt.html --width "$width" --height "$height" --output "work/rc-final/profile-before-$width"
            python tools/profile-compact.py --entry outputs/Ranger-Kompakt.html --width "$width" --height "$height" --output "work/rc-final/profile-after-$width"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && matrix.check != 'visual'
        with:
          name: Ranger-RC-${{ matrix.check }}
          path: work/rc-final/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && matrix.check == 'visual'
        with:
          name: Ranger-RC-comparison
          path: work/rc-final/visual-*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && matrix.check == 'visual'
        with:
          name: Ranger-RC-gallery
          path: work/rc-final/gallery
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && matrix.check == 'visual'
        with:
          name: Ranger-RC-sky
          path: work/rc-final/sky
          if-no-files-found: error
          retention-days: 30
