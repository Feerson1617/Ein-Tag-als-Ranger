name: Ranger RC browser diagnosis
on: workflow_dispatch
permissions:
  contents: read
jobs:
  reference-browser-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_WEBKIT: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Feerson1617/Interaktive-Lernmodelle-SKORM
          ref: 86006235258195cae76a6cfe33c0be58f4bd05d1
          path: work/scorm/reference
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python tools/scorm/prepare-reference.py work/scorm/reference
      - run: python -m pip install -r tools/scorm-template/requirements.txt
      - run: npm ci && npx playwright install --with-deps chromium webkit && npm run prepare:example && npm run build
        working-directory: work/scorm/reference
      - name: Compare shell and full browser with the same tests and limits
        working-directory: work/scorm/reference
        run: |
          python - <<'PY'
          import subprocess,os,json,pathlib,shutil,platform,time
          out=pathlib.Path('../../rc-browser-diagnosis');out.mkdir(parents=True,exist_ok=True)
          full=subprocess.check_output(['node','--input-type=module','-e',"import{chromium}from'playwright';console.log(chromium.executablePath())"],text=True).strip()
          report={'platform':platform.platform(),'cpus':os.cpu_count(),'fullBrowser':full,'version':subprocess.check_output([full,'--version'],text=True).strip(),'runs':[]}
          for label,workers,binary in [('default-one',1,None),('default-normal',2,None),('full-one',1,full),('full-normal',2,full)]:
            env=dict(os.environ)
            if binary:env['CHROMIUM_PATH']=binary
            command=['npx','playwright','test','--workers',str(workers)]
            if workers==1:command+=['--project','chromium']
            start=time.monotonic()
            with (out/(label+'.log')).open('w')as log:result=subprocess.run(command,env=env,stdout=log,stderr=subprocess.STDOUT)
            shutil.copytree('test-results',out/label,dirs_exist_ok=True)
            report['runs'].append({'label':label,'command':command,'executable':binary or 'unchanged config default','returncode':result.returncode,'wallSeconds':time.monotonic()-start})
            (out/'result.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Ranger-RC-browser-diagnosis
          path: work/rc-browser-diagnosis/
          retention-days: 30
