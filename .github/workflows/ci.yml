name: Ranger checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/run-checks.py
      - run: python tools/build-web.py && python tools/verify-web.py
      - run: python tools/build-standalone.py
      - run: python tools/build-compact.py && python tools/verify-compact.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/package-project.py
      - run: python tools/browser-check.py --live --resilience --width 800 --height 500 --site outputs/GitHub-Pages --prefix /Ein-Tag-als-Ranger/
      - run: python tools/browser-check.py --smoke --width 800 --height 500 --site outputs --entry Feldbuch.html
      - name: Preserve check evidence (fresh CI fixtures only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ranger-check-evidence
          path: work/
          retention-days: 7
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node tests/kompakt-check.mjs
      - run: python tools/build-compact.py && python tools/verify-compact.py
      - run: python tools/browser-compact.py
      - run: python tools/browser-compact.py --site outputs --entry Ranger-Kompakt.html --smoke
      - name: Preserve compact reference renders and checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ranger-compact-reference-evidence
          path: work/compact-browser/
          retention-days: 7
