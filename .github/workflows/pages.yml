name: Approved Ranger Pages release
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed commit on main (40 hexadecimal characters)
        required: true
        type: string
      approval:
        description: After reviewing the release report, type VEROEFFENTLICHEN
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ranger-pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' && inputs.approval == 'VEROEFFENTLICHEN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RANGER_APPROVED_SHA: ${{ inputs.approved_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact approved commit on main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RANGER_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$RANGER_APPROVED_SHA^{commit}"
          git merge-base --is-ancestor "$RANGER_APPROVED_SHA" origin/main
          git checkout --detach "$RANGER_APPROVED_SHA"
          test "$(git rev-parse HEAD)" = "$RANGER_APPROVED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/run-checks.py
      - run: python tools/build-web.py && python tools/verify-web.py
      - run: python tools/build-standalone.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/browser-check.py --live --width 800 --height 500 --site outputs/GitHub-Pages --prefix /Ein-Tag-als-Ranger/
      - name: Confirm clean source and approved build identity
        run: |
          python -c 'import json,os; m=json.load(open("outputs/GitHub-Pages/build-manifest.json")); assert m["sourceCommit"] == os.environ["RANGER_APPROVED_SHA"] and not m["sourceDirty"]'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: outputs/GitHub-Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only the tested Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
