name: Ranger Preview (kein Deployment)
on:
  push:
    branches: [preview/ranger-v1-local]
permissions:
  contents: read
jobs:
  standalone-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout geprüfter Spielstand
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Eigenständige HTML-Vorschau bauen
        run: python tools/build-standalone.py
      - name: Playwright Chromium für direkten Datei-Test
        run: |
          python -m pip install "playwright==1.62.0"
          python -m playwright install --with-deps chromium
      - name: Direktes Öffnen der HTML-Datei prüfen (file-Protokoll)
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          html = Path('outputs/Feldbuch.html').resolve()
          assert html.is_file() and html.stat().st_size > 10000000
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=['--enable-webgl', '--enable-unsafe-swiftshader', '--use-angle=swiftshader'])
              page = browser.new_page(viewport={'width': 1024, 'height': 768})
              errors = []
              page.on('pageerror', lambda err: errors.append(str(err)))
              page.goto(html.as_uri(), wait_until='domcontentloaded', timeout=120000)
              page.wait_for_function("() => { const start = document.getElementById('start'); return start && !start.disabled; }", timeout=120000)
              page.screenshot(path='Ranger-Vorschau-Bild.png')
              print('PASS: Direkte lokale HTML-Datei gestartet, Startbutton aktiv:', html.name)
              if errors:
                  raise AssertionError('Fehler im lokalen HTML-Start: ' + '; '.join(errors[:4]))
              browser.close()
          PY
      - name: Kurze Startanleitung beilegen
        run: |
          cat > VORSCHAU-LESEN.txt <<'TXT'
          RANGER-SPIEL: UNVEROEFFENTLICHTE VORSCHAU
          
          1. Dieses GitHub-Actions-Artefakt als ZIP herunterladen.
          2. ZIP auf dem Mac entpacken.
          3. Feldbuch.html mit einem aktuellen Chrome- oder Chromium-Browser oeffnen.
          4. "Lernmissionen" und "Freie Erkundung" ausprobieren.
          
          Getesteter Quellstand: siehe GitHub-Actions-Lauf und dessen Commit.
          Das HTML ist eigenstaendig, benoetigt weder Webserver noch Installation.
          Die Datei wurde unter file:// in Chromium mit WebGL gestartet und geprueft.
          Safari auf einem echten iPad ist noch nicht freigegeben.
          Ein gruenes Testergebnis ist keine Unterrichtserprobung.
          
          Kein Merge, kein Pages-Deployment und keine oeffentliche Website.
          TXT
      - name: Geprüfte Vorschau als herunterladbares Artefakt bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ranger-Spiel-v1-Vorschau-ohne-Pages
          path: |
            outputs/Feldbuch.html
            VORSCHAU-LESEN.txt
            Ranger-Vorschau-Bild.png
          retention-days: 14
          if-no-files-found: error
